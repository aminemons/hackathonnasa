name: Scientific gates
on:
  push:
    branches: [science-audit-2026-11-15]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-audit.txt
      - run: python -m pytest -q tests/test_science_gate.py
