name: Landslide quality checks

on:
  push:
    branches: [main, dataset-alarm-glacier-reliability, landslide-gunw-backend]
  pull_request:
    branches: [landslide-gunw-backend, main]

permissions:
  contents: read

jobs:
  python-and-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            machine learning/requirements.txt
            machine learning/glof/requirements.txt
      - name: Install API and scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r "machine learning/requirements.txt"
          python -m pip install -r "machine learning/glof/requirements.txt"
      - name: Validate Python syntax
        run: python -m compileall -q api "machine learning"
      - name: Audit published NASA GIBS tile matrix and formats
        run: python scripts/audit_gibs.py
      - name: Test API, ONNX example and scar classification contract
        run: python -m unittest discover -s api/tests -v
      - name: Test GUNW geospatial preprocessing with synthetic products
        run: python -m unittest discover -s "machine learning/tests" -v
      - name: Reproduce a real GLOF water-model observation
        run: python "machine learning/glof/check_example.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:glof
      - run: npm run test:reliability
      - run: npm run build

  browser-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: python -m pip install 'playwright>=1.55,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Start built site
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/terrapulse-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/terrapulse-preview.log
          exit 1
      - name: Exercise Time tabs, glacier motion, dataset removals and alarms in Chromium
        run: python scripts/smoke_browser.py
